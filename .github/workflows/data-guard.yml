name: Repository Data Guard
on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: Scan Git objects and verify hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Check incoming commits and run guard tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: sh scripts/ci-data-guard.sh "$BASE_SHA"
