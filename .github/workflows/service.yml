name: Web service
on:
  pull_request:
  push:
    branches: [ha-runthrough]
permissions:
  contents: read

jobs:
  data-guard:
    name: Service data guard
    uses: ./.github/workflows/data-guard.yml
  core:
    needs: data-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_DB: web_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1::5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      NO_PROXY: "*"
      no_proxy: "*"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
            target
          key: web-pg17-sqlx0.8.6-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Prepare PostgreSQL and SQLx
        run: |
          if ! command -v pg_config || ! test -x "$(pg_config --bindir)/initdb"; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y postgresql libpq-dev
          fi
          pg_config --bindir >> "$GITHUB_PATH"
          if ! sqlx --version 2>/dev/null | grep -Fqx 'sqlx-cli 0.8.6'; then
            cargo install sqlx-cli --locked --version 0.8.6 --no-default-features --features postgres,rustls
          fi
      - name: Migrate the isolated test database
        env:
          TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          export DATABASE_URL="postgresql://postgres@127.0.0.1:$TEST_PG_PORT/web_ci"
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" >> "$GITHUB_ENV"
          printf 'WEB_ADMIN_TOKEN_FILE=%s/web-ci-absent-admin.env\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          sh scripts/ci-check.sh sqlx-migrate cargo sqlx migrate run
      - run: sh scripts/ci-check.sh rustfmt cargo fmt --all -- --check
      - run: sh scripts/ci-check.sh clippy cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: sh scripts/ci-check.sh cargo-test cargo test --workspace --locked
      - run: sh scripts/ci-check.sh sqlx-prepare cargo sqlx prepare --check -- --all-targets
      - name: Boot the HTTP service and verify shutdown
        run: |
          sh scripts/ci-check.sh build-web cargo build --locked --bin web
          export WEB_BIN="$PWD/target/debug/web"
          sh scripts/ci-check.sh core-http python3 -B tests/api/core_http.py
          sh scripts/ci-check.sh finance-resilience python3 -B tests/api/finance_resilience.py
          sh scripts/ci-check.sh finance-writes python3 -B tests/api/finance_writes.py
      - name: Export and compare OpenAPI
        run: |
          output=$(mktemp -d)
          trap 'rm -rf -- "$output"' EXIT
          sh scripts/ci-check.sh openapi-export sh -c 'target/debug/web export-openapi > "$1"' sh "$output/web.openapi.json"
          sh scripts/ci-check.sh openapi-second-export sh -c 'target/debug/web export-openapi > "$1"' sh "$output/web.second.json"
          sh scripts/ci-check.sh openapi-repeat cmp -s "$output/web.openapi.json" "$output/web.second.json"
          sh scripts/ci-check.sh openapi-snapshot cmp -s "$output/web.openapi.json" openapi/web.openapi.json
          sh scripts/ci-check.sh diff-check git diff --check
