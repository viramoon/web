name: Finance client generation
on:
  pull_request:
  push:
    branches: [main, ha-runthrough]
permissions:
  contents: read
jobs:
  data-guard:
    name: Finance client data guard
    uses: ./.github/workflows/data-guard.yml
  regenerate:
    needs: data-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Regenerate from the recorded finance contract
        run: |
          sh scripts/ci-check.sh finance-client-generation scripts/gen-finance-client.sh --check
