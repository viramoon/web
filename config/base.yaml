server:
  bind_host: 127.0.0.1
  port: 8090
  request_timeout_ms: 15000
  max_body_bytes: 1048576
  shutdown_timeout_ms: 20000
database:
  url: postgres://localhost/web
  connect_timeout_ms: 2000
  acquire_timeout_ms: 2000
  auto_migrate: true
finance:
  base_url: http://127.0.0.1:8081
  ready_timeout_ms: 2000
  required_for_ready: false
  connect_timeout_ms: 3000
  request_timeout_ms: 3000
  max_retries: 2
  backoff_ms: 150
  circuit_failure_threshold: 3
  circuit_open_ms: 10000
paths:
  static_root: /home/box/fertile/static/current
security:
  admin_token_file: /home/box/fertile/secrets/web.env
  max_requests: 10
  window_ms: 60000
  public_origin: null
  session_ttl_seconds: 900
credentials:
  directory: null
  recipient_public_key_file: null
