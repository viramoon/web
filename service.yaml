# 组件进程与接口说明，实际部署定义属于 fertile/deploy。
version: 2
system: fertile
component: web
deployment_source: "viramoon/fertile:deploy/service.yaml"
environment:
  FERTILE_PROFILE: cloudbox
  WEB_CONFIG_DIR: config
  WEB_BIND_HOST: 127.0.0.1
  WEB_PORT: 8090
  WEB_STATIC_ROOT: /home/box/fertile/static/current
  FINANCE_BASE_URL: http://127.0.0.1:8081
  WEB_REQUIRE_FINANCE: false
  DATABASE_URL: 由部署环境传入，仅引用受控配置
  WEB_PUBLIC_ORIGIN: 可选，浏览器管理会话使用的规范 HTTPS origin
  WEB_ADMIN_SESSION_TTL_SECONDS: 900
  WEB_CREDENTIAL_DIR: 可选，web 所有且权限为 0700 的持久化绝对目录
  WEB_CREDENTIAL_RECIPIENT_PUBLIC_KEY_FILE: 可选，与 WEB_CREDENTIAL_DIR 成对设置的 RSA 公钥 PEM 绝对路径
finance_http:
  config_section: finance
  cloudbox: {connect_timeout_ms: 3000, request_timeout_ms: 3000, backoff_ms: 150, circuit_failure_threshold: 3, circuit_open_ms: 10000}
  stable: {connect_timeout_ms: 1000, request_timeout_ms: 2000, backoff_ms: 100, circuit_failure_threshold: 5, circuit_open_ms: 5000}
  max_read_retries: 2
  write_retries: 0
processes:
  - name: web
    command: web serve
    port: 8090
    health:
      live: /healthz/live
      ready: /healthz/ready
    graceful_stop:
      signals: [SIGTERM, SIGINT]
      deadline_ms: 20000
static:
  hosted_by: web
  root_from: paths.static_root
  index_cache: no-cache
  immutable_assets: "public, max-age=31536000, immutable"
  spa_fallback: 仅页面 GET
database:
  schemas: [app, blog]
  migration_command: web migrate
  auto_migrate_default: true
  backup_and_rollback: 见 fertile 的部署和备份恢复手册
ingress:
  public_origin: https://fertile.viramoon.com
  owner: Maas · Ruler
runbook: RUNBOOK.md
write_access:
  secret_file_env: WEB_ADMIN_TOKEN_FILE
  secret_file_default: /home/box/fertile/secrets/web.env
  secret_key: WEB_ADMIN_TOKEN
  mode: "0600"
  missing_file: writes_disabled_403
  session:
    cookie: __Host-web_admin_session
    attributes: [HttpOnly, Secure, SameSite=Strict, Path=/]
    csrf_header: X-CSRF-Token
    lifetime_seconds: 900
  rate_limit: {max_requests: 10, window_ms: 60000, identity: single_admin}
