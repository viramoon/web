# 组件进程与接口说明，实际部署定义属于 fertile/deploy。
version: 2
system: fertile
component: web
deployment_source: "viramoon/fertile:deploy/service.yaml"
environment:
  FERTILE_PROFILE: cloudbox
  WEB_CONFIG_DIR: config
  WEB_BIND_HOST: 127.0.0.1
  WEB_PORT: 8090
  WEB_STATIC_ROOT: /home/box/fertile/static/current
  FINANCE_BASE_URL: http://127.0.0.1:8081
  WEB_REQUIRE_FINANCE: false
  DATABASE_URL: 由部署环境传入，仅引用受控配置
  WEB_PUBLIC_ORIGIN: 可选，浏览器管理会话使用的规范 HTTPS origin。省略时仅允许与请求 Host（含端口）匹配的 HTTP 回环同源会话
  WEB_ADMIN_SESSION_TTL_SECONDS: 900
  WEB_CREDENTIAL_DIR: 可选，web 所有且权限为 0700 的持久化绝对目录
  WEB_CREDENTIAL_RECIPIENT_PUBLIC_KEY_FILE: 可选，与 WEB_CREDENTIAL_DIR 成对设置的 RSA 公钥 PEM 绝对路径
  WEB_BINANCE_PROBES_ENABLED: false
  WEB_STRATEGY_COMPILER: 可选，finance F2 策略编译器绝对路径
  WEB_RESEARCH_PYTHON: 可选，安装 finance 研究依赖的解释器绝对路径
  WEB_TEST_RCLONE: /usr/bin/rclone
  WEB_INTEGRATION_PRIMARY_STRATEGY_FILE: 可选，部署预置的策略文件
  WEB_INTEGRATION_PRIMARY_RESEARCH_MANIFEST: 可选，部署预置的研究数据清单
  WEB_INTEGRATION_PRIMARY_DRIVE_TEST_ROOT: 可选，web 所有的 0700 本机加密测试目录
  WEB_INTEGRATION_SECONDARY_STRATEGY_FILE: 可选，备选槽位的策略文件
  WEB_INTEGRATION_SECONDARY_RESEARCH_MANIFEST: 可选，备选槽位的研究数据清单
  WEB_INTEGRATION_SECONDARY_DRIVE_TEST_ROOT: 可选，备选槽位的 0700 本机加密测试目录
  WEB_BACKUP_STATUS_FILE: 可选，T2b 备份远端状态文件
  WEB_BACKUP_RESTORE_FILE: 可选，T2b 隔离恢复凭据文件
  WEB_QUALITY_STATUS_FILE: 可选，授权的采集质量快照
finance_http:
  config_section: finance
  contract_notes: docs/api.md#finance-契约版本
  cloudbox: {connect_timeout_ms: 3000, request_timeout_ms: 3000, backoff_ms: 150, circuit_failure_threshold: 3, circuit_open_ms: 10000}
  stable: {connect_timeout_ms: 1000, request_timeout_ms: 2000, backoff_ms: 100, circuit_failure_threshold: 5, circuit_open_ms: 5000}
  max_read_retries: 2
  write_retries: 0
market_gateway:
  finance_contract: openapi/finance.commit
  access: administrator
  cache_control: no-store
  legacy_wal_event_versions: ["1.0", "2.0"]
  rest_reads: {max_requests: 120, window_seconds: 60, identity: single_admin}
  watchlists: {table: app.market_watchlists, migration: "20261127040000", max_instruments: 64}
  depth_focus: {path: /api/v1/market/depth-focus, state: process_local}
  subscriptions:
    path: /api/v1/market/subscriptions
    web_limit: 8
    identity: single_admin
    finance_lines_legacy_field: finance_contract_pending
    finance_budget: /api/v1/market/subscriptions/budget
    finance_coverage: /api/v1/market/subscriptions/coverage
  f10c_display_reads:
    venue_depth: /api/v1/market/depth
    option_chain: /api/v1/options/chain
    option_exposure: /api/v1/options/exposure
    option_history: /api/v1/options/history
    source: authorized_ibkr_paper_read_only_market_owner
  legacy_option_chain_query: {path: /api/v1/options/chain, status: 503, code: finance_contract_pending}
  f10d_display_reads:
    legacy_option_flow: /api/v1/options/flow
    observations: {path: /api/v1/options/flow/observations, product: opra}
    verification: {path: /api/v1/options/flow/verification, product: opra-history}
    source: authorized_ibkr_paper_read_only_market_owner
  events:
    path: /api/v1/events
    protocol: sse
    heartbeat_seconds: 15
    retained_events: 128
    max_connections: 16
    alert_window: 32
  market_stream:
    path: /api/v1/stream/market
    protocol: websocket
    event_schema: openapi/finance.market-ws.schema.json
    source: finance_committed_wal
    max_connections: 16
    max_command_bytes: 4096
  interface: docs/api.md
maintenance:
  publish_quality:
    command: web publish-quality INPUTS
    output_env: WEB_QUALITY_STATUS_FILE
    instructions: docs/quality-publishing.md
processes:
  - name: web
    command: web serve
    port: 8090
    health:
      live: /healthz/live
      ready: /healthz/ready
    graceful_stop:
      signals: [SIGTERM, SIGINT]
      deadline_ms: 20000
  - name: web-notifier
    command: web-notifier
    requires: [PostgreSQL, "/usr/bin/curl (SMTP/SMTPS)", system_ca, linux_proc]
    delivery_policy:
      manual_silence: 规则或单条告警匹配时暂停领取，到期或解除后按原策略处理
      documentation: docs/api.md#主动静默
    environment:
      DATABASE_URL: 与 web 共用，由部署从受控配置注入
      WEB_STATIC_ROOT: 启用 SMTP 快照时必填，与 web 使用同一静态根绝对路径
      WEB_PUBLIC_ORIGIN: 可选，邮件内使用的私有终端 HTTPS origin
      WEB_SMTP_HOST: 部署配置的固定邮件中继
      WEB_SMTP_PORT: 隐式 TLS 默认 465，STARTTLS 默认 587
      WEB_SMTP_TLS: implicit
      WEB_SMTP_FROM: 部署配置的固定发件地址
      WEB_SMTP_TO: 部署配置的本人收件地址
      WEB_SMTP_CREDENTIAL_FILE: 可选，仅引用由本机部署提供的 0600 秘密文件绝对路径
      WEB_SMTP_TIMEOUT_SECONDS: 10
      WEB_SMTP_SECONDARY_HOST: 可选，备选 SMTP 槽位。其他 WEB_SMTP_SECONDARY_* 参数与主槽位同名
      WEB_SMTP_SNAPSHOT_DIR: W4 SMTP 必需，notifier 独占的 0700 持久绝对目录，逐级校验且位于静态资源树外
      WEB_NOTIFIER_QUIET_TIME_ZONE: Asia/Shanghai
      WEB_NOTIFIER_QUIET_START: "23:00"
      WEB_NOTIFIER_QUIET_END: "08:00"
      WEB_NOTIFIER_COOLDOWN_SECONDS: 900
      WEB_NOTIFIER_NORMAL_HOURLY_LIMIT: 6
      WEB_NOTIFIER_URGENT_HOURLY_LIMIT: 2
      WEB_NOTIFIER_URGENT_BYPASS_QUIET: true
    health:
      web_status: /api/v1/system/status
      field: notifications.state
    graceful_stop:
      signals: [SIGTERM, SIGINT]
      deadline_ms: 85000
telemetry:
  format: json_stderr
  request_metadata: [request_id, method, path, status, latency_ms]
  event_targets: [web, "web::*", web_notifier, "web_notifier::*"]
  failure_details: web 记录固定阶段，web-notifier 记录固定阶段与原因，panic 使用固定事件
  repository_data_guard: docs/data-guard.md
static:
  hosted_by: web
  root_from: paths.static_root
  index_cache: no-cache
  immutable_assets: "public, max-age=31536000, immutable"
  spa_fallback: 仅页面 GET
database:
  schemas: [app, blog]
  migration_command: web migrate
  auto_migrate_default: true
  notification_silences: 20261127074531_notification_silences.sql
  backup_and_rollback: 见 fertile 的部署和备份恢复手册
ingress:
  public_origin: https://fertile.viramoon.com
  owner: Maas · Ruler
runbook: RUNBOOK.md
write_access:
  secret_file_env: WEB_ADMIN_TOKEN_FILE
  secret_file_default: /home/box/fertile/secrets/web.env
  secret_key: WEB_ADMIN_TOKEN
  mode: "0600"
  missing_file: writes_disabled_403
  session:
    cookie: __Host-web_admin_session
    attributes: [HttpOnly, Secure, SameSite=Strict, Path=/]
    csrf_header: X-CSRF-Token
    lifetime_seconds: 900
  rate_limit: {max_requests: 10, window_ms: 60000, identity: single_admin}
