# 组件进程与接口说明，实际部署定义属于 fertile/deploy。
version: 2
system: fertile
component: web
deployment_source: "viramoon/fertile:deploy/service.yaml"
environment:
  FERTILE_PROFILE: cloudbox
  WEB_CONFIG_DIR: config
  WEB_BIND_HOST: 127.0.0.1
  WEB_PORT: 8080
  WEB_STATIC_ROOT: /home/box/fertile/static/current
  FINANCE_BASE_URL: http://127.0.0.1:8081
  WEB_REQUIRE_FINANCE: false
  DATABASE_URL: 由部署环境传入，仅引用受控配置
processes:
  - name: web
    command: web serve
    port: 8080
    health:
      live: /healthz/live
      ready: /healthz/ready
    graceful_stop:
      signals: [SIGTERM, SIGINT]
      deadline_ms: 20000
static:
  hosted_by: web
  root_from: paths.static_root
  index_cache: no-cache
  immutable_assets: "public, max-age=31536000, immutable"
  spa_fallback: 仅页面 GET
database:
  schemas: [app, blog]
  migration_command: web migrate
  auto_migrate_default: true
  backup_and_rollback: 见 fertile 的部署和备份恢复手册
tunnel:
  public_origin: 待用户确认
  candidates: [www.viramoon.com, www.viramoonstar.com]
runbook: RUNBOOK.md
