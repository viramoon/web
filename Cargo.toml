[package]
name = "web"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "web"

[dependencies]
finance-client = { path = "crates/finance-client", default-features = false }
fastrand = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
sha2 = "0.10"
subtle = "2"
libc = "0.2"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
openssl = "0.10"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "native-tls"] }
rust_decimal = { version = "=1.43.0", default-features = false, features = ["std"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "chrono", "json", "uuid"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "fs", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
utoipa = { version = "5", features = ["chrono"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = "=0.29.0"
