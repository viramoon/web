[package]
name = "web"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
finance-client = { path = "crates/finance-client", default-features = false }
fastrand = "2"
sha2 = "0.10"
subtle = "2"
libc = "0.2"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "fs", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
utoipa = { version = "5", features = ["chrono"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
